name: Verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api
          NEXT_PUBLIC_SITE_URL: https://preview.example.com
          SEO_INDEXABLE: "false"

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy
        env:
          VERCEL: "1"
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-change-me
          DATABASE_URL: sqlite:///:memory:
          DJANGO_ALLOWED_HOSTS: api.preview.example.com
          CORS_ALLOWED_ORIGINS: https://preview.example.com
          CSRF_TRUSTED_ORIGINS: https://preview.example.com
          FRONTEND_URL: https://preview.example.com
      - run: python manage.py test
        env:
          DJANGO_SECRET_KEY: ci-only-not-a-production-secret-change-me
          DJANGO_DEBUG: "false"
